[project]
name = "frontend"
version = "0.1.0"
description = "EORunner frontend application"
readme = "README.md"
authors = [
    { name = "Bartosz Gleń", email = "33288445+karmek-k@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
]

[project.scripts]
manage = "manage:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "eorunner"
module-root = "eorunner"
